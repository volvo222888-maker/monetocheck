<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>МонетоЧек — монетизация и доход YouTube-канала</title>
<style>
:root{--bg:#f6f4ee;--surface:#fff;--ink:#16181d;--muted:#5d6370;--line:#e3dfd3;--accent:#0f766e;--accent-ink:#fff;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0e1311;--surface:#161d1a;--ink:#eef2ee;--muted:#9aa7a0;--line:#26312c;--accent:#5eead4;--accent-ink:#06201c;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:900px;margin:0 auto;padding:0 20px 40px}
.logo{font-weight:800;font-size:20px;padding:20px 0}.logo b{color:var(--accent)}
h1{font-size:clamp(28px,6vw,48px);line-height:1.1;letter-spacing:-.03em;margin:8px 0 12px;max-width:18ch}
.lead{color:var(--muted);margin:0 0 22px;max-width:56ch}
form{display:flex;gap:10px;flex-wrap:wrap}
input{flex:1;min-width:220px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit}
button{padding:14px 24px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
button:disabled{opacity:.6}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin-top:18px}
.head{display:flex;gap:16px;align-items:center}
.head img{width:64px;height:64px;border-radius:50%}
.head h2{margin:0;font-size:22px}.sub{color:var(--muted);font-size:13px}
.badge{display:inline-block;padding:6px 14px;border-radius:99px;font-weight:700;border:1px solid;margin:14px 0 4px}
.b-likely{color:var(--ok)}.b-partial{color:var(--warn)}.b-unlikely{color:var(--bad)}.b-unknown{color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px;margin-top:14px}
.stats div{background:var(--bg);border-radius:12px;padding:12px}.stats b{display:block;font-size:20px}
.big{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:-.03em}
h3{margin:0 0 10px}
.vid{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.vid span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vid span:last-child{color:var(--muted);white-space:nowrap}
.note{font-size:12px;color:var(--muted);margin-top:12px}
.err{color:var(--bad);margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<div class="logo">Моне<b>то</b>Чек</div>
<h1>Проверь монетизацию любого канала</h1>
<p class="lead">Вставь ссылку на канал или видео — увидишь, показывается ли реклама, и примерный доход.</p>
<form id="f"><input id="u" placeholder="https://youtube.com/@channel" autocomplete="off" required><button id="b">Проверить</button></form>
<div id="out" aria-live="polite"></div>
</div>
<script>
const $=i=>document.getElementById(i),out=$('out');
const n=x=>Math.round(x).toLocaleString('ru-RU'),usd=x=>'$'+(x<10?x.toFixed(2):n(x));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ST={likely:['Монетизация, вероятно, включена','Реклама показывается на большинстве проверенных видео.'],
partial:['Монетизация возможна','Реклама найдена только на части видео — видимо, часть контента не монетизируется.'],
unlikely:['Монетизация, скорее всего, выключена','Реклама на проверенных видео не обнаружена.'],
unknown:['Не удалось определить','Не получилось проверить страницы видео. Попробуйте позже.']};
$('f').addEventListener('submit',async e=>{
 e.preventDefault();$('b').disabled=true;out.innerHTML='<div class="card">Проверяем…</div>';
 try{
  const r=await fetch('/api/check?url='+encodeURIComponent($('u').value)),d=await r.json();
  if(!r.ok)throw new Error(d.error||'Ошибка');
  const c=d.channel,m=d.monetization,s=ST[m.status],ea=d.earnings;
  out.innerHTML=
  '<div class="card"><div class="head"><img src="'+esc(c.avatar)+'" alt=""><div><h2>'+esc(c.title)+'</h2><div class="sub">'+esc(c.handle||'')+(c.country?' · '+esc(c.country):'')+' · создан '+new Date(c.created).toLocaleDateString('ru-RU')+'</div></div></div>'
  +'<div class="badge b-'+m.status+'">'+s[0]+'</div><div class="sub">'+s[1]+(m.checked?' Проверено видео: '+m.checked+', с рекламой: '+m.withAds+'.':'')+'</div>'
  +(m.belowThreshold?'<div class="note">Подписчиков меньше 500 — по правилам YPP монетизация обычно недоступна (возможны исключения, например через MCN).</div>':'')
  +(c.kids?'<div class="note">Канал помечен как «сделано для детей» — реклама на нём ограничена.</div>':'')
  +'<div class="stats"><div><b>'+(c.subs===null?'скрыто':n(c.subs))+'</b><span class="sub">подписчики</span></div><div><b>'+n(c.views)+'</b><span class="sub">просмотры</span></div><div><b>'+n(c.videos)+'</b><span class="sub">видео</span></div></div></div>'
  +(ea?'<div class="card"><h3>Оценка дохода</h3><div class="sub">В месяц (по темпу последних видео, ~'+n(ea.monthly.views)+' просм.)</div><div class="big">'+usd(ea.monthly.lo)+' – '+usd(ea.monthly.hi)+'</div><div class="sub">За год: '+usd(ea.monthly.lo*12)+' – '+usd(ea.monthly.hi*12)+'</div>'
   +(ea.lifetime?'<div class="sub" style="margin-top:10px">За всё время: '+usd(ea.lifetime.lo)+' – '+usd(ea.lifetime.hi)+'</div>':'')
   +'<div class="note">Это оценка по средним ставкам RPM для категории (Shorts — намного ниже). Доход считается только если монетизация реально включена. Точные цифры видит лишь владелец в YouTube Studio.</div></div>':'')
  +'<div class="card"><h3>Последние видео</h3>'+d.videos.map(v=>'<div class="vid"><span>'+(v.short?'▪ ':'')+esc(v.title)+'</span><span>'+n(v.views)+' просм.'+(v.ads===true?' · реклама':v.ads===false?' · без рекламы':'')+'</span></div>').join('')+'</div>';
 }catch(err){out.innerHTML='<div class="err">'+esc(err.message)+'</div>'}
 $('b').disabled=false;
});
</script>
</body>
</html>
